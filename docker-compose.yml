# docker-compose.yml — Postgres e MinIO do COMPUTADOR LOCAL.
#
# Produção não usa este arquivo: na etapa 1 os serviços são do Easypanel, e o
# compose de produção da etapa 2 só é escrito na mudança de casa. Ver
# docs/10-infra-deploy.md e docs/adr/0020.
#
# Não há Redis: as filas ficam no próprio Postgres, pelo pg-boss. Ver docs/adr/0008.
#
# Portas presas a 127.0.0.1 e deslocadas. O Postgres usa a 5435 porque a 5434 já
# costuma estar ocupada por um PostgreSQL instalado direto no Windows, e a 5433
# pelo vortex.

services:
  postgres:
    image: postgres:16-alpine
    container_name: postit-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postit}
      POSTGRES_DB: ${POSTGRES_DB:-postit}
      TZ: UTC # o servidor pensa em UTC. Ver docs/adr/0006
    volumes:
      - postgres-dados:/var/lib/postgresql/data
      # Cria o banco postit_test na primeira subida, para os testes da API
      # (docs/15: o teste recusa rodar em banco que não termina em _test).
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # Build da comunidade (pgsty), com versão fixa: a MinIO tirou as imagens gratuitas
    # do Docker Hub e do quay.io em setembro de 2026. Ver docs/adr/0028.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: postit-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9002:9000" # API S3 — é esta porta que o segundo túnel expõe
      - "127.0.0.1:9003:9001" # console de administração, só local
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-postit}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-postit-local-123}
      # Origem exata do app, como o docs/10 exige. Sem esta variável o MinIO ecoa
      # QUALQUER origem que perguntar, com Allow-Credentials — e o envio
      # funcionaria em desenvolvimento para quebrar só na estreia, que é o pior
      # desfecho possível.
      #
      # ⚠️ Lida no boot. O túnel sorteia endereço novo a cada `npm run tunnel`,
      # então trocar APP_URL no .env exige recriar o container:
      #   docker compose up -d --force-recreate minio
      # Um `up -d` sozinho não recria por mudança de variável, e o CORS continua
      # com o endereço antigo — parecendo que a configuração não funciona.
      #
      # O CORS não é a proteção: a política assinada é (docs/11). Isto só impede
      # que outro site tente usar o armazenamento a partir do navegador de quem
      # está logado aqui.
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_URL:-http://localhost:3010}
    command: server /data --console-address ":9001"
    volumes:
      - minio-dados:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Prepara o bucket do PostIt: leitura pública só em publicas/ e ciclo de vida
  # apagando envios abandonados em recebidos/. Ver docs/adr/0012 e docs/10.
  #
  # Roda a cada `docker compose up` e sai. Repetível: `mb --ignore-existing` e
  # `anonymous set` não reclamam do que já existe, e o ciclo de vida é **refeito**
  # — apaga todas as regras do bucket e cria a única que o projeto usa.
  #
  # Refeito, e não "criado se faltar": a conferência antiga passava o `ilm rule ls`
  # por `grep`, que a imagem do mc não tem. O `grep` falhava sempre, e a regra era
  # acrescentada de novo a cada subida — seis cópias iguais em 24/09/2026. Apagar e
  # recriar não depende de ferramenta nenhuma e limpa as cópias que já existiam. O
  # bucket só tem esta regra, e ela nasce aqui. Para rodar de novo: npm run media:setup
  media-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: postit-media-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-postit}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-postit-local-123}
      BUCKET: ${MINIO_BUCKET:-postit}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$BUCKET &&
      mc anonymous set download local/$$BUCKET/publicas &&
      (mc ilm rule rm --all --force local/$$BUCKET > /dev/null 2>&1 || true) &&
      mc ilm rule add --prefix recebidos/ --expire-days 1 local/$$BUCKET &&
      echo bucket $$BUCKET pronto, leitura publica so em publicas/
      "

volumes:
  postgres-dados:
  minio-dados:

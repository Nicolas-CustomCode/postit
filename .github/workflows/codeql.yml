# CodeQL: análise de segurança do código, a cada push na main e toda semana
# (docs/15), como no alivio-crm. Os resultados aparecem na aba Security do GitHub.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  # O CodeQL lê a execução do workflow para enviar o resultado. Sem esta linha a
  # análise roda inteira e falha no envio, com "Resource not accessible by
  # integration".
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Fora dos pedidos do Dependabot: neles o GitHub entrega um token só de
    # leitura, e o envio do resultado é recusado — a análise roda por 4 minutos
    # para falhar no fim. Quem confere esses pedidos é a CI. O código deles entra
    # na análise da main assim que o pedido for aceito.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

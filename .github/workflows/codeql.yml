# CodeQL: análise de segurança do código, a cada push na main e toda semana
# (docs/15), como no alivio-crm. Os resultados aparecem na aba Security do GitHub.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  # Em repositório privado, o CodeQL lê a execução do workflow para enviar o
  # resultado. Sem esta linha a análise roda inteira e falha no envio, com
  # "Resource not accessible by integration".
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4

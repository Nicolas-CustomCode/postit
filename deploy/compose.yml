# deploy/compose.yml — o PostIt inteiro em produção (ADR 0030).
#
# Um arquivo com as seis peças: Postgres, MinIO, a preparação do bucket e os três
# processos da mesma imagem — api, worker e web. Na VPS, é o serviço Compose do
# Easypanel que o roda, e é o Easypanel quem dá HTTPS e domínio:
#
#   app    → serviço web,   porta 3010
#   mídia  → serviço minio, porta 9000
#
# Mais nenhum. A api fica **sem domínio** (AGENTS.md, regra 4): só o web a alcança,
# pela rede interna do compose. Postgres e o console do MinIO também não saem.
#
# Sem `ports` e sem `container_name`, como o Easypanel pede: quem expõe é ele, e
# nome fixo colidiria entre projetos. Para testar no computador, há o
# compose.local.yml, que só acrescenta portas.
#
# As variáveis vêm do .env ao lado (no Easypanel, a aba Environment do serviço, com
# "Create .env file"). A lista, sem valores, está em deploy/.env.example. Cada
# processo recebe **só** o que usa: o web não vê o banco, o worker não vê a chave
# interna.
#
# Trocar de versão: POSTIT_TAG=vX.Y.Z no .env e Deploy. A api aplica as migrations
# ao subir — o dump manual vem antes (docs/10, "Dump e restauração").

x-postit-image: &postit-image
  image: ghcr.io/nicolas-customcode/postit:${POSTIT_TAG:?defina POSTIT_TAG no .env}
  restart: unless-stopped

# O que api e worker leem do banco, do MinIO e da Meta. Endereços internos do compose:
# `postgres` e `minio` são os nomes dos serviços abaixo.
x-backend-env: &backend-env
  NODE_ENV: production
  TZ: UTC # o servidor pensa em UTC (ADR 0006)
  DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
  MINIO_BUCKET: ${MINIO_BUCKET:-postit}
  MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
  IG_APP_ID: ${IG_APP_ID:-}
  IG_APP_SECRET: ${IG_APP_SECRET:-}
  IG_API_VERSION: ${IG_API_VERSION:-v26.0}
  SESSION_IDLE_DAYS: ${SESSION_IDLE_DAYS:-7}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      TZ: UTC
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # Build da comunidade, com versão fixa (ADR 0028).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      # Só a origem do app envia direto ao MinIO (docs/10). Lida no boot: trocar
      # APP_URL exige recriar este serviço.
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_URL:?}
    command: server /data
    volumes:
      - minio-dados:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Prepara o bucket a cada subida e sai: leitura pública só em publicas/, e o ciclo
  # de vida que apaga envio abandonado em recebidos/ depois de 1 dia (ADR 0012). É o
  # media-init do docker-compose.yml do computador, com o mesmo cuidado: o ciclo de
  # vida é refeito, e não acrescentado, para não acumular cópias.
  bucket-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      BUCKET: ${MINIO_BUCKET:-postit}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$BUCKET &&
      mc anonymous set download local/$$BUCKET/publicas &&
      (mc ilm rule rm --all --force local/$$BUCKET > /dev/null 2>&1 || true) &&
      mc ilm rule add --prefix recebidos/ --expire-days 1 local/$$BUCKET &&
      echo bucket $$BUCKET pronto, leitura publica so em publicas/
      "

  # O processo HTTP da API. Aplica as migrations antes de subir — é o primeiro dos
  # três a ficar pronto, e o web espera por ele.
  api:
    <<: *postit-image
    command: ["api"]
    depends_on:
      postgres:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully
    environment:
      <<: *backend-env
      APP_URL: ${APP_URL:?}
      API_HOST: 0.0.0.0
      API_PORT: 3011
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?}
      STATE_SECRET: ${STATE_SECRET:?}
      IG_REDIRECT_URI: ${APP_URL}/contas/conectar/retorno
      SESSION_MAX_DAYS: ${SESSION_MAX_DAYS:-30}
      TOTP_ISSUER: ${TOTP_ISSUER:-PostIt}
    healthcheck:
      # /health exige a chave interna, como toda rota da API.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3011/health',{headers:{'x-internal-key':process.env.INTERNAL_API_KEY}}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # O único que publica (regra 1). Espera a api para não disputar as migrations.
  worker:
    <<: *postit-image
    command: ["worker"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *backend-env
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      PUSH_SWEEP_SECONDS: ${PUSH_SWEEP_SECONDS:-10}

  # As telas e o BFF. Não vê banco nem credencial do MinIO (regra 4): fala só com a api.
  web:
    <<: *postit-image
    command: ["web"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?}
      WEB_PORT: 3010
      INTERNAL_API_URL: http://api:3011
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3010/entrar').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  postgres-dados:
  minio-dados:
